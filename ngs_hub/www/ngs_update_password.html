{% extends "templates/web.html" %}

{% block navbar %}{% endblock %}
{% block footer %}{% endblock %}

{% block page_content %}
<div class="ngs-portal ngs-password-page">
  {% set active_page = "password" %}
  {% include "templates/includes/ngs_topbar.html" %}

  <section class="ngs-hero">
    <div>
      <h1>Update Password</h1>
    </div>
    <div class="ngs-profile-summary" id="ngs-password-summary">Loading profile...</div>
  </section>

  <form id="ngs-password-form" class="ngs-form ngs-password-form">
    <div class="ngs-password-grid">
      <label>Current password
        <input name="old_password" type="password" autocomplete="current-password" required>
      </label>
      <label>New password
        <input name="new_password" type="password" autocomplete="new-password" required>
      </label>
      <label>Confirm new password
        <input name="confirm_password" type="password" autocomplete="new-password" required>
      </label>
      <label class="ngs-check ngs-password-check">
        <input name="logout_all_sessions" type="checkbox" checked> <span>Log out other sessions</span>
      </label>
    </div>
    <button type="submit" class="ngs-primary" id="ngs-password-submit">Update password</button>
    <p class="ngs-message" id="ngs-password-message" role="status" aria-live="polite"></p>
  </form>
</div>

<style>
  .ngs-password-form { max-width: 640px; }
  .ngs-password-grid { display: grid; gap: 12px; }
  .ngs-password-check { min-height: 38px; align-items: center; }
</style>

<script>
frappe.ready(() => {
  const form = document.getElementById('ngs-password-form');
  const message = document.getElementById('ngs-password-message');
  const submit = document.getElementById('ngs-password-submit');
  const summary = document.getElementById('ngs-password-summary');

  function setMessage(text, isError = false) {
    message.textContent = text;
    message.style.color = isError ? '#9b2c2c' : '#26635b';
  }

  frappe.call('ngs_hub.api.portal.get_registration_context')
    .then((response) => {
      const data = response.message || {};
      if (data.customer) {
        summary.innerHTML = `<strong>${data.customer.full_name || data.user?.full_name || 'Customer profile'}</strong><br><span class="ngs-muted">${data.customer.organization || data.customer.email || ''}</span>`;
      } else {
        summary.innerHTML = `<strong>Customer profile</strong><br><span class="ngs-muted">${data.user?.email || ''}</span>`;
      }
    })
    .catch(() => {
      summary.textContent = 'Profile unavailable';
    });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!form.reportValidity()) return;

    const oldPassword = form.elements.old_password.value;
    const newPassword = form.elements.new_password.value;
    const confirmPassword = form.elements.confirm_password.value;

    if (oldPassword === newPassword) {
      setMessage('New password must be different from the current password.', true);
      form.elements.new_password.focus();
      return;
    }

    if (newPassword !== confirmPassword) {
      setMessage('New passwords do not match.', true);
      form.elements.confirm_password.focus();
      return;
    }

    submit.disabled = true;
    setMessage('Updating password...');

    try {
      const response = await frappe.call({
        type: 'POST',
        method: 'frappe.core.doctype.user.user.update_password',
        args: {
          old_password: oldPassword,
          new_password: newPassword,
          logout_all_sessions: form.elements.logout_all_sessions.checked ? 1 : 0,
        },
      });
      form.reset();
      setMessage('Password updated. Returning to the portal...');
      setTimeout(() => {
        window.location.href = response.message || '/ngs_account';
      }, 1200);
    } catch (error) {
      submit.disabled = false;
      setMessage(error.message || 'Unable to update password.', true);
    }
  });
});
</script>
{% endblock %}
